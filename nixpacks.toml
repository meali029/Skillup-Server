[phases.setup]
nixPkgs = ['nodejs_20', 'python311', 'python311Packages.pip']

[phases.install]
cmds = [
  'npm ci',
  'pip install --break-system-packages --no-cache-dir -r requirements.txt'
]

[phases.build]
cmds = [
  'mkdir -p /app/.EasyOCR',
  'EASYOCR_MODULE_PATH=/app/.EasyOCR python3 -c "import easyocr; easyocr.Reader([\"en\"], gpu=False, verbose=False, model_storage_directory=\"/app/.EasyOCR\")"'
]

[start]
cmd = 'EASYOCR_MODULE_PATH=/app/.EasyOCR npm start'
